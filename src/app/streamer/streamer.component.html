<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="col-video col-video-full">
                <div class="video-frame">
                    <div class="video-remote">
                        <div class="video-frame-status">
                            <span>Ao Vivo</span>
                        </div>
                        <div class="video-loading"></div>
                        <div id="videos-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        @if (!hasShowStart) {
            <button (click)="onCreateShow()">
                Start Streaming
            </button>
        } @else {
            <button (click)="onStopShow()">
                Stop Streaming
            </button>
        }
    </div>
</div>
